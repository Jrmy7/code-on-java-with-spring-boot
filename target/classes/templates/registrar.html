<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
</head>
<body>
<h2>Registro de Usuarios</h2>
<form th:action="@{/api/usuarios/registrar}" th:object="${usuario}" method="post">
    <label>Nombre:</label><br>
    <input type="text" th:field="*{nombre}" required /><br><br>

    <label>Mail:</label><br>
    <input type="email" th:field="*{mail}" required /><br><br>

    <label>Contraseña:</label><br>
    <input type="password" th:field="*{password}" required /><br><br>

    <button type="submit">Registrar</button>
</form>
</body>
</html>
